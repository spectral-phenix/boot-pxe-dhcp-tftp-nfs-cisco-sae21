# /etc/dhcp/dhcpd.conf — servpxe-4 (groupe 4, classe 172.16.4.0/26)
#
# Version relue : les écarts avec la version rendue pendant la SAÉ sont
# signalés par « CORRIGÉ » (voir README, section « Relecture »).

# Bail de 30 minutes, comme demandé par le cahier des charges.
# CORRIGÉ : la version rendue avait 600 s (10 min) ; la capture Wireshark le montre.
default-lease-time 1800;
max-lease-time 1800;

ddns-update-style none;

# Démarrage réseau : réponses BOOTP et démarrage PXE autorisés
allow bootp;
allow booting;

# ---------------------------------------------------------------------------
# Réseau1 — 172.16.4.56/30 — lien serveur (ens19) ↔ routeur (Gi0/1)
# Aucune adresse distribuée, mais la déclaration est obligatoire :
# sans elle, dhcpd ignore en silence les requêtes relayées qui arrivent sur ens19.
# ---------------------------------------------------------------------------
subnet 172.16.4.56 netmask 255.255.255.252 {
}

# ---------------------------------------------------------------------------
# Réseau2 — 172.16.4.48/29 — VM clientes sur vmbr1 (ens20)
# ---------------------------------------------------------------------------
subnet 172.16.4.48 netmask 255.255.255.248 {
    # CORRIGÉ : la plage allait jusqu'à .54, adresse réservée à clipxe-4
    range 172.16.4.50 172.16.4.53;
    option routers 172.16.4.49;
    option broadcast-address 172.16.4.55;
    option domain-name-servers 194.57.85.210;
    filename "pxelinux.0";
    next-server 172.16.4.49;          # serveur TFTP vu depuis Réseau2
}

# ---------------------------------------------------------------------------
# Réseau3 — 172.16.4.0/27 — Raspberry Pi et PC de la salle, derrière le routeur
# Les requêtes arrivent par le relais DHCP du routeur (ip helper-address).
# ---------------------------------------------------------------------------
subnet 172.16.4.0 netmask 255.255.255.224 {
    range 172.16.4.3 172.16.4.9;
    option routers 172.16.4.1;
    option broadcast-address 172.16.4.31;
    option domain-name-servers 194.57.85.210;
    filename "pxelinux.0";
    next-server 172.16.4.57;          # serveur TFTP vu depuis Réseau1
}

# ---------------------------------------------------------------------------
# Réservations (adresse MAC → adresse IP)
# ---------------------------------------------------------------------------

# VM cliente PXE : dernière adresse de Réseau2
host clipxe-4 {
    hardware ethernet bc:24:11:f4:f2:52;
    fixed-address 172.16.4.54;
    filename "pxelinux.0";
    next-server 172.16.4.49;
}

# Raspberry Pi 4 : 10e adresse de Réseau3
host raspi-4 {
    hardware ethernet d8:3a:dd:0c:fe:70;
    fixed-address 172.16.4.10;
    filename "pxelinux.0";            # CORRIGÉ : « pxelinux-0 » dans la version rendue
    next-server 172.16.4.57;
    # Options lues par le chargeur de démarrage du Raspberry Pi
    option tftp-server-name "172.16.4.57";                      # option 66
    option vendor-class-identifier "PXEClient";                 # option 60
    option vendor-encapsulated-options "Raspberry Pi Boot";     # option 43
}

# PC de la salle de TP : 11e adresse de Réseau3
host pcsalletp-4 {
    hardware ethernet f0:b2:b9:23:30:d7;
    fixed-address 172.16.4.11;
    filename "pxelinux.0";            # CORRIGÉ : « pxelinux-0 » dans la version rendue
    next-server 172.16.4.57;
}

# Raspberry Pi n°2 (jalon 12) : 12e adresse de Réseau3
# Renseigner son adresse MAC (relevée avec « ip addr show eth0 ») avant d'activer ce bloc.
#host raspi2-4 {
#    hardware ethernet XX:XX:XX:XX:XX:XX;
#    fixed-address 172.16.4.12;
#    next-server 172.16.4.57;
#    option tftp-server-name "172.16.4.57";
#    option vendor-class-identifier "PXEClient";
#    option vendor-encapsulated-options "Raspberry Pi Boot";
#}

# Serveur fermé : aucune adresse pour une machine non déclarée ci-dessus.
# CORRIGÉ : la ligne était commentée dans la version rendue.
deny unknown-clients;
